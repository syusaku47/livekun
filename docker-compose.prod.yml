services:
  postgres:
    image: postgres:16
    container_name: livekun-postgres
    restart: always
    environment:
      POSTGRES_USER: livekun
      POSTGRES_PASSWORD: livekun
      POSTGRES_DB: livekun
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U livekun"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: livekun-backend
    restart: always
    ports:
      - "3001:3001"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: livekun
      DB_PASSWORD: livekun
      DB_NAME: livekun
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: livekun-frontend
    restart: always
    ports:
      - "80:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    depends_on:
      - backend

volumes:
  postgres_data:
